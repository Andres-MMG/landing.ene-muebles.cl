# Production compose file moved to repo root.
#
# Coolify's BuildKit resolves `context: .` from the compose file location.
# With the file at `infrastructure/docker-compose.yml` and `context: ..`,
# BuildKit could not resolve the full source tree. The root-level compose
# file at `../docker-compose.yml` uses `context: .` and resolves correctly.
#
# See the root `docker-compose.yml` and `infrastructure/README.md`.
