# Coolify Compose Stack
#
# Topology: Coolify proxy -> web (port 3000) -> cms (public paths + internal) -> db (internal)
# Coolify owns host ports 80/443, TLS certificates, and its Traefik instance.
# The web service is public at WEB_PUBLIC_HOSTNAME through Coolify's managed
# proxy. The CMS exposes only `/api` and `/uploads` at CMS_PUBLIC_HOSTNAME;
# its admin UI and the database remain private on the internal Docker network.
#
# Image SHAs are pinned at deploy time by Coolify; this file is the
# shape of the stack, not the version authority.

name: landing

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required at build time}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:?STRAPI_INTERNAL_URL is required}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required}
      # Strapi issues these only after its first bootstrap. Public catalog reads
      # work without STRAPI_API_TOKEN when the Public role has read permission;
      # admin routes reject requests when neither token is configured.
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      STRAPI_ADMIN_TOKEN: ${STRAPI_ADMIN_TOKEN:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      NEXT_PUBLIC_FEATURE_LEAD_FORM: ${NEXT_PUBLIC_FEATURE_LEAD_FORM:-off}
    expose:
      - "3000"
    depends_on:
      cms:
        condition: service_healthy
    networks:
      - landing_internal
      # Coolify's managed Traefik reaches the public web service through its
      # shared, externally managed proxy network.
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.web-public.rule=Host(`${WEB_PUBLIC_HOSTNAME:?WEB_PUBLIC_HOSTNAME is required}`)"
      - "traefik.http.routers.web-public.entrypoints=https"
      - "traefik.http.routers.web-public.tls=true"
      - "traefik.http.routers.web-public.service=web-public"
      - "traefik.http.services.web-public.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  cms:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required}
      APP_KEYS: ${APP_KEYS:?APP_KEYS is required}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_CLIENT: mysql
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      DATABASE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DATABASE_SSL: "false"
      CLIENT_ADMIN_PASSWORD: ${CLIENT_ADMIN_PASSWORD:?CLIENT_ADMIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - landing_internal
      # Coolify's managed Traefik reaches this service through its shared,
      # externally managed proxy network. `landing_internal` remains the
      # private path for web-to-CMS and CMS-to-db communication.
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.cms-public.rule=Host(`${CMS_PUBLIC_HOSTNAME:?CMS_PUBLIC_HOSTNAME is required}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.cms-public.entrypoints=https"
      - "traefik.http.routers.cms-public.tls=true"
      - "traefik.http.routers.cms-public.service=cms-public"
      - "traefik.http.services.cms-public.loadbalancer.server.port=1337"
    volumes:
      - cms_uploads:/repo/apps/cms/public/uploads
      - cms_tmp:/repo/apps/cms/.tmp
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:1337/admin"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - "--default-authentication-plugin=caching_sha2_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    networks:
      - landing_internal
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-u"
        - "root"
        - "--password=${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  landing_internal:
    driver: bridge
    name: landing_internal
  coolify:
    external: true
    name: coolify

volumes:
  cms_uploads:
  cms_tmp:
  db_data:
