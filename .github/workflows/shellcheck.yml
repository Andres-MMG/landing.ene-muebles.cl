name: Shellcheck

on:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tracked shell scripts
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' -t scripts < <(git ls-files -z -- '*.sh')

          if (( ${#scripts[@]} == 0 )); then
            echo "No tracked shell scripts found; nothing to check."
            exit 0
          fi

          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::ShellCheck is not available on the runner."
            exit 1
          fi

          shellcheck "${scripts[@]}"
