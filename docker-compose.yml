# Coolify Compose Stack — root-level deployment entry point
#
# Topology: proxy (Traefik v3) -> web (Next.js, port 3000)
#                                    + cms (Strapi, port 1337)
#                                    -> db (MySQL, port 3306)
#
# The `proxy` service publishes host ports 80/443. All other services are
# reachable only through the internal `landing_internal` Docker network.
# Traefik routes public traffic as follows:
#   web router: Host(ene-muebles.cl) || Host(www.ene-muebles.cl)
#   cms router: Host(cms.ene-muebles.cl) && (PathPrefix(/api) || PathPrefix(/uploads))
#
# Why root-level? Coolify's BuildKit resolves `context: .` from the compose
# file location. With the file at the repo root, `context: .` correctly
# encompasses the full source tree (apps/, packages/, etc.).

name: landing

services:
  proxy:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=landing_internal"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@landing.ene-muebles.cl}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - landing_internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy_letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:?STRAPI_INTERNAL_URL is required}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      STRAPI_ADMIN_TOKEN: ${STRAPI_ADMIN_TOKEN:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      NEXT_PUBLIC_FEATURE_LEAD_FORM: ${NEXT_PUBLIC_FEATURE_LEAD_FORM:-off}
    depends_on:
      cms:
        condition: service_healthy
    networks:
      - landing_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=landing_internal"
      - "traefik.http.routers.web.rule=Host(`${WEB_PUBLIC_HOSTNAME:-ene-muebles.cl}`) || Host(`${WEB_PUBLIC_WWW_HOSTNAME:-www.ene-muebles.cl}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required}
      APP_KEYS: ${APP_KEYS:?APP_KEYS is required}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_CLIENT: mysql
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      DATABASE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DATABASE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      CLIENT_ADMIN_PASSWORD: ${CLIENT_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - landing_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=landing_internal"
      - "traefik.http.routers.cms-public.rule=Host(`${CMS_PUBLIC_HOSTNAME:-cms.ene-muebles.cl}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.cms-public.entrypoints=websecure"
      - "traefik.http.routers.cms-public.tls=true"
      - "traefik.http.routers.cms-public.service=cms-public"
      - "traefik.http.services.cms-public.loadbalancer.server.port=1337"
    volumes:
      - cms_uploads:/repo/apps/cms/public/uploads
      - cms_tmp:/repo/apps/cms/.tmp
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - "--default-authentication-plugin=caching_sha2_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    networks:
      - landing_internal
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-u"
        - "root"
        - "--password=${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  landing_internal:
    driver: bridge
    name: landing_internal

volumes:
  proxy_letsencrypt:
  cms_uploads:
  cms_tmp:
  db_data:
