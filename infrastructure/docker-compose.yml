# Coolify Compose Stack
#
# Topology: Coolify proxy -> web (port 3000) -> cms (internal) -> db (internal)
# Coolify owns host ports 80/443, TLS certificates, and its Traefik instance.
# Configure the web service domain in Coolify with container port 3000.
# `cms` and `db` are reachable only through the internal Docker network.
#
# Image SHAs are pinned at deploy time by Coolify; this file is the
# shape of the stack, not the version authority.

name: landing

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:?STRAPI_INTERNAL_URL is required}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:?STRAPI_API_TOKEN is required}
      STRAPI_ADMIN_TOKEN: ${STRAPI_ADMIN_TOKEN:?STRAPI_ADMIN_TOKEN is required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      NEXT_PUBLIC_FEATURE_LEAD_FORM: ${NEXT_PUBLIC_FEATURE_LEAD_FORM:-off}
    expose:
      - "3000"
    depends_on:
      cms:
        condition: service_healthy
    networks:
      - landing_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  cms:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_CLIENT: mysql
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USERNAME: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_SSL: "false"
      CLIENT_ADMIN_PASSWORD: ${CLIENT_ADMIN_PASSWORD:?CLIENT_ADMIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - landing_internal
    volumes:
      - cms_uploads:/srv/app/apps/cms/public/uploads
      - cms_tmp:/srv/app/apps/cms/.tmp
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:1337/admin"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - "--default-authentication-plugin=caching_sha2_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    networks:
      - landing_internal
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-u"
        - "root"
        - "--password=${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  landing_internal:
    driver: bridge
    name: landing_internal

volumes:
  cms_uploads:
  cms_tmp:
  db_data:
