rules:
  proposal:
    - Include rollback plan for risky changes
    - Treat Next.js and Strapi as two deployable surfaces (independent rollback)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Delta spec MUST separate frontend (Next.js) and backend (Strapi) requirements
  design:
    - Include sequence diagrams for complex flows (form submission, CMS fetch)
    - Document CORS, cache, and ISR strategy for Next.js <-> Strapi boundary
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Frontend tasks and backend tasks MUST be tracked separately
