name: Bug report
description: Report a reproducible problem
title: "fix: "
labels:
  - bug
  - status:needs-review
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. A maintainer must add `status:approved` before implementation begins.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checks
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I understand this issue needs `status:approved` before a pull request can be opened.
          required: true
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Clearly describe the problem.
      placeholder: Explain what is broken and when the problem occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a numbered, minimal sequence that consistently reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Describe what happened instead, including relevant error messages.
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Linux (Other)
        - Windows
        - WSL
    validations:
      required: true

  - type: dropdown
    id: agent-client
    attributes:
      label: Agent / Client
      options:
        - Claude Code
        - OpenCode
        - Gemini CLI
        - Cursor
        - Windsurf
        - Codex
        - Other
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - bash
        - zsh
        - fish
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Remove secrets and sensitive data before pasting relevant output.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add screenshots, workarounds, or any other useful information.
