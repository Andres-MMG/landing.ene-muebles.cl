# Coolify Compose Stack — root-level deployment entry point
#
# Topology: Coolify-managed Traefik -> web (Next.js, port 3000)
#                                       + cms (Strapi, port 1337)
#                                       -> db (MySQL, port 3306)
#
# Public routing is handled by Coolify's managed Traefik proxy.
# The `coolify` external network is created by Coolify on the VPS
# and already has a running Traefik instance that handles SSL,
# Let's Encrypt, and port publishing.
#
# Configure routing in Coolify UI for each service:
#   web: ene-muebles.cl, www.ene-muebles.cl -> port 3000
#   cms: cms.ene-muebles.cl -> port 1337
#
# No Traefik labels needed — Coolify generates them from the UI config.
#
# Why root-level? Coolify's BuildKit resolves `context: .` from the compose
# file location. With the file at the repo root, `context: .` correctly
# encompasses the full source tree (apps/, packages/, etc.).

name: landing

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:?STRAPI_INTERNAL_URL is required}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      STRAPI_ADMIN_TOKEN: ${STRAPI_ADMIN_TOKEN:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      NEXT_PUBLIC_FEATURE_LEAD_FORM: ${NEXT_PUBLIC_FEATURE_LEAD_FORM:-off}
    depends_on:
      cms:
        condition: service_healthy
    networks:
      - landing_internal
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: ${NEXT_PUBLIC_STRAPI_URL:?NEXT_PUBLIC_STRAPI_URL is required}
      APP_KEYS: ${APP_KEYS:?APP_KEYS is required}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_CLIENT: mysql
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      DATABASE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DATABASE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      STRAPI_BOOTSTRAP_SUPER_ADMIN_EMAIL: ${STRAPI_BOOTSTRAP_SUPER_ADMIN_EMAIL:?STRAPI_BOOTSTRAP_SUPER_ADMIN_EMAIL is required}
      STRAPI_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${STRAPI_BOOTSTRAP_SUPER_ADMIN_PASSWORD:?STRAPI_BOOTSTRAP_SUPER_ADMIN_PASSWORD is required}
      CLIENT_ADMIN_PASSWORD: ${CLIENT_ADMIN_PASSWORD:?CLIENT_ADMIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - landing_internal
      - coolify
    volumes:
      - cms_uploads:/repo/apps/cms/public/uploads
      - cms_tmp:/repo/apps/cms/.tmp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1337/_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - "--default-authentication-plugin=caching_sha2_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    networks:
      - landing_internal
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-u"
        - "root"
        - "--password=${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  landing_internal:
    driver: bridge
    name: landing_internal
  coolify:
    name: coolify
    external: true

volumes:
  cms_uploads:
  cms_tmp:
  db_data:
